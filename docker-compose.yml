services:
  # PostgreSQL service for company-db
  company-db:
    image: postgres
    container_name: company-db
    environment:
      POSTGRES_USER: kaido1712
      POSTGRES_PASSWORD: kaido1712
      POSTGRES_DB: company
    volumes:
      - company-db-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      internal-network:
        ipv4_address: 172.20.0.2
    restart: always

  # PostgreSQL service for asset-management-db
  asset-management-db:
    image: postgres
    container_name: asset-management-db
    environment:
      POSTGRES_USER: kaido1712
      POSTGRES_PASSWORD: kaido1712
      POSTGRES_DB: asset_management
    volumes:
      - asset-management-db-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    networks:
      internal-network:
        ipv4_address: 172.20.0.3
    restart: always

  # pgAdmin service
  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: vannguyenthe1712@gmail.com
      PGADMIN_DEFAULT_PASSWORD: kaido1712
    ports:
      - "5050:80"
    volumes:
      - pgadmin-data:/var/lib/postgresql/data
    networks:
      internal-network:
        ipv4_address: 172.20.0.4
    depends_on:
      - company-db
      - asset-management-db
    restart: always

  # RabbitMQ service
  rabbitmq:
    image: rabbitmq:management
    container_name: rabbitmq-server
    ports:
      - "5672:5672" # RabbitMQ messaging port
      - "15672:15672" # RabbitMQ management console
    environment:
      RABBITMQ_DEFAULT_USER: kaido1712
      RABBITMQ_DEFAULT_PASS: kaido1712
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    networks:
      internal-network:
        ipv4_address: 172.20.0.5
    restart: always

  # MinIO service
  asset-minio:
    image: minio/minio
    container_name: minio1
    environment:
      MINIO_ROOT_USER: kaido1712
      MINIO_ROOT_PASSWORD: kaido1712
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000" # MinIO server port
      - "9001:9001" # MinIO console port
    volumes:
      - minio-data:/data
    networks:
      internal-network:
        ipv4_address: 172.20.0.6
    restart: always

# Define named volumes
volumes:
  company-db-data:
  asset-management-db-data:
  rabbitmq-data:
  minio-data:
  pgadmin-data:

    # Define networks with static IP range
networks:
  internal-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
